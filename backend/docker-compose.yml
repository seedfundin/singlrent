services:
  postgres:
    image: postgres:16-alpine
    container_name: singlerent-postgres
    environment:
      POSTGRES_DB: singlerent
      POSTGRES_USER: singlerent
      POSTGRES_PASSWORD: singlerent
    ports:
      # 5432 is commonly occupied by a developer's existing PostgreSQL install.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U singlerent -d singlerent']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: singlerent-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
